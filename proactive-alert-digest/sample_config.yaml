# Proactive Alert Digest — Sample Configuration
# Generated by `digest init`

output:
  # Local file output
  file: ./digest_output.md
  # Slack webhook (optional)
  slack_webhook: ""

sources:
  # 1. HTTP Health Check
  - name: "Google Health"
    type: http_check
    config:
      url: "https://www.google.com"
      timeout: 5
      expected_status: 200

  - name: "Example API"
    type: http_check
    config:
      url: "https://httpstat.us/500"
      timeout: 5
      expected_status: 200

  # 2. Log File Pattern Matching
  - name: "App Logs"
    type: log_pattern
    config:
      path: "/var/log/syslog"
      tail_lines: 50
      patterns:
        - regex: "ERROR|error|Error"
          severity: warning
        - regex: "CRITICAL|FATAL|panic"
          severity: critical

  # 3. Docker Container Status
  - name: "Docker Containers"
    type: docker_status
    config:
      containers: []  # empty = report all running containers

  # 4. Prometheus Mock (demonstrates plugin extensibility)
  - name: "Prometheus Metrics"
    type: prometheus_mock
    config:
      mock_alerts: []  # empty = generate random demo alerts
