[project]
name = "aicslint"
version = "0.1.0"
description = "AI Code Smell Linter — tree-sitter AST based detection of AI-generated code patterns"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.1",
    "tree-sitter>=0.25.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
]

[tool.setuptools.packages.find]
include = ["aicslint*"]

[dependency-groups]
dev = [
    "pylint>=4.0.5",
]

[project.scripts]
aicslint = "aicslint.cli:main"
